[project]
name = "canarygame"
version = "0.1.0"
description = "Adaptive multi-agent honeytoken indistinguishability and quarantine experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "torch>=2.6; sys_platform == 'linux'",
    "vllm>=0.9,<0.12; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
gen = [
    "datasets>=3.0",
    "huggingface_hub>=0.28",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "boto3>=1.35",
]
sim = [
    "openai>=1.30",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canarygame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
