    n_agents: 3
    n_attackers: 2
    attacker_intents: [medium, medium]
    n_decoys: 4
    max_steps: 40
    action_budget: 30
    benign_tasks: 3

  containment:
    shared_memory: true
    decoy_policy: private
    broker: true
    quarantine: true
    n_agents: 3
